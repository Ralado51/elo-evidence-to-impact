# Override for the VPS (Portainer Git stack: add this file under "Additional paths").
# Attaches every service to the existing Traefik network "proxy" and reuses the
# existing data volume. pull_policy: build makes a Git update rebuild the images.
# No secrets here: variables go in the stack's environment.
services:
  landing:
    pull_policy: build
    networks:
      - proxy
    labels:
      - traefik.docker.network=proxy

  web:
    pull_policy: build
    networks:
      - proxy
    labels:
      - traefik.docker.network=proxy

  api:
    pull_policy: build
    networks:
      - proxy
    labels:
      - traefik.docker.network=proxy

volumes:
  evidence_data:
    external: true
    name: evidence_evidence_data

networks:
  proxy:
    external: true
    name: proxy
