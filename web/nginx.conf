server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
    # modules and wasm must have the right MIME type; default_type only applies when mime.types has no entry
    location ~ ^/app/vendor/.*\.mjs$ { default_type text/javascript; expires 1d; }
    location ~ ^/app/vendor/.*\.wasm$ { default_type application/wasm; expires 1d; }
    location /app/vendor/ { expires 1d; }  # pinned versions: safe to cache
    location = /app { return 301 /app/; }
    # the app's own files: always revalidate (ETag keeps it cheap) so a new deploy shows up without a hard reload.
    # 'expires -1' sends Cache-Control: no-cache and, unlike add_header here, keeps the security headers above.
    location /app/ { expires -1; try_files $uri $uri/ /app/index.html; }
}
