# Portainer stack (Git repository). Works with the existing Traefik.
#
# This stack creates its own network (evidence_net). After the first deploy,
# connect the Traefik container to it (Portainer > Containers > traefik >
# "Join a network" > evidence_net), the same way it is connected to the
# other application networks.
#
# Optional stack environment variables (defaults in parentheses):
#   APP_DOMAIN          (evidence.eloterapia.com.br)
#   TRAEFIK_ENTRYPOINT  (websecure)
#   CERT_RESOLVER       (leresolver)
#   ELO_ACCESS_TOKEN    (empty = open; set it for a public deployment: the app then asks for this code)
#   LLM_BASE_URL / LLM_API_KEY / LLM_MODEL / EXTRACTION_MODE / LLM_TIMEOUT
# Routing on one host: / = landing (priority 1), /app = static app (20), /api = API (30).
# Data (SQLite: registry, notes, audit) lives in the evidence_data volume. Synthetic data only.
# Secrets (model API key etc.) go in the stack's environment, never in this repo.
# After the 2026-11-30 23:59 freeze, keep Git auto-update off and pin the stack to a tag/commit.

services:
  landing:
    build: ./landing
    restart: unless-stopped
    networks:
      - evidence_net
    labels:
      - traefik.enable=true
      - traefik.docker.network=evidence_net
      - traefik.http.routers.evidence.rule=Host(`${APP_DOMAIN:-evidence.eloterapia.com.br}`)
      - traefik.http.routers.evidence.priority=1
      - traefik.http.routers.evidence.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.evidence.tls=true
      - traefik.http.routers.evidence.tls.certresolver=${CERT_RESOLVER:-leresolver}
      - traefik.http.services.evidence.loadbalancer.server.port=80

  web:
    build: ./web
    restart: unless-stopped
    networks:
      - evidence_net
    labels:
      - traefik.enable=true
      - traefik.docker.network=evidence_net
      - traefik.http.routers.evidence-web.rule=Host(`${APP_DOMAIN:-evidence.eloterapia.com.br}`) && PathPrefix(`/app`)
      - traefik.http.routers.evidence-web.priority=20
      - traefik.http.routers.evidence-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.evidence-web.tls=true
      - traefik.http.routers.evidence-web.tls.certresolver=${CERT_RESOLVER:-leresolver}
      - traefik.http.services.evidence-web.loadbalancer.server.port=80

  api:
    build: ./api
    restart: unless-stopped
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-180}
      EXTRACTION_MODE: ${EXTRACTION_MODE:-llm}
      ELO_ACCESS_TOKEN: ${ELO_ACCESS_TOKEN:-}
      ELO_DATA_DIR: /data
    volumes:
      - evidence_data:/data
    networks:
      - evidence_net
    labels:
      - traefik.enable=true
      - traefik.docker.network=evidence_net
      - traefik.http.routers.evidence-api.rule=Host(`${APP_DOMAIN:-evidence.eloterapia.com.br}`) && PathPrefix(`/api`)
      - traefik.http.routers.evidence-api.priority=30
      - traefik.http.routers.evidence-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.evidence-api.tls=true
      - traefik.http.routers.evidence-api.tls.certresolver=${CERT_RESOLVER:-leresolver}
      - traefik.http.services.evidence-api.loadbalancer.server.port=8000

volumes:
  evidence_data:

networks:
  evidence_net:
    name: evidence_net
