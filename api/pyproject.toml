[project]
name = "elo-evidence-to-impact"
version = "0.1.0"
description = "Evidence-first documentation for pediatric rehabilitation (synthetic data only)."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "fastapi>=0.110", "uvicorn>=0.29", "python-docx>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
elo = ["packs/*.json"]
